[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "rxmesh-diff-energy"
version = "0.1.0"
description = "Example PyRXMesh differentiable energy plugin"
requires-python = ">=3.10"
dependencies = [
    "PyRXMesh",
]

[tool.scikit-build]
minimum-version = "0.12"
cmake.version = ">=3.25,<4"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/rxmesh_diff_energy"]
build.targets = ["_rxmesh_diff_energy"]
install.components = ["python"]
