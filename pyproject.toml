[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "PyRXMesh"
version = "0.2.1rc2"
description = "Python bindings for RXMesh, a CUDA/C++ library for mesh processing on the GPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmed Mahmoud" },
]
classifiers = [
    "Development Status :: 3 - Alpha",    
    "Programming Language :: C++",
    "Programming Language :: Python :: 3"
]

[project.urls]
RXMesh = "https://github.com/owensgroup/RXMesh"
Documentation = "https://ahdhn.github.io/RXMeshDocs/"

[project.scripts]
pyrxmesh-plugin = "pyrxmesh.plugin:main"

[tool.scikit-build]
minimum-version = "0.12"
cmake.version = ">=3.25,<4"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pyrxmesh"]
build.targets = ["_rxmesh"]
install.components = ["python"]

sdist.include = [
    "examples/custom_kernel_plugin/CMakeLists.txt",
    "examples/custom_kernel_plugin/README.md",
    "examples/custom_kernel_plugin/pyproject.toml",
    "examples/custom_kernel_plugin/run_edge_lengths.py",
    "examples/custom_kernel_plugin/src/rxmesh_edge_lengths.cu",
    "examples/custom_kernel_plugin/src/rxmesh_edge_lengths_tests.cu",
    "examples/custom_kernel_plugin/src/rxmesh_edge_lengths/__init__.py",
    "examples/diff_energy_plugin/CMakeLists.txt",
    "examples/diff_energy_plugin/README.md",
    "examples/diff_energy_plugin/pyproject.toml",
    "examples/diff_energy_plugin/run_diff_energy.py",
    "examples/diff_energy_plugin/src/rxmesh_diff_energy.cu",
    "examples/diff_energy_plugin/src/rxmesh_diff_energy/__init__.py",
    "/CMakeLists.txt",
    "/LICENSE",
    "/README.md",
    "/DEVELOPING.md",
    "/CUSTOM_CUDA_PLUGINS.md",
    "/DIFFERENTIABLE_ENERGY_PLUGINS.md",
    "benchmarks/**",
    "cmake/**",
    "include/**",
    "meshes/**",
    "pyrxmesh/**",
    "src/**",
    "tests/**",
    "!**/build/**",
    "!**/dist/**",
    "!**/.pytest_cache/**",
    "!**/__pycache__/**",
    "!**/*.pyc",
    "!**/*.pyo",
    "!**/*.pyd",
    "!**/*.log",
]
sdist.exclude = [
    "**/build/**",
    "**/dist/**",
    ".github/**",
    "**/.pytest_cache/**",
    ".vscode/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pyd",
    "**/*.log",
]

[tool.scikit-build.cmake.define]
PYRXMESH_RXMESH_GIT_REPO = "https://github.com/owensgroup/RXMesh.git"
PYRXMESH_RXMESH_GIT_TAG = "main"
PYRXMESH_RXMESH_SOURCE_DIR = ""
PYRXMESH_USE_POLYSCOPE = "ON"
PYRXMESH_BUILD_RXMESH_TESTS = "OFF"
PYRXMESH_BUILD_RXMESH_APPS = "OFF"
PYRXMESH_USE_DOUBLE = "OFF"
PYRXMESH_USE_CUDSS = "OFF"
PYRXMESH_USE_SUITESPARSE = "OFF"
